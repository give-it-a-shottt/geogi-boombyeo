# 거기붐벼? 전체 구성: DB + 조회 API + 수집 워커 + 웹
# 실행 전에 .env에 SEOUL_API_KEY, POSTGRES_PASSWORD, SITE_URL을 넣는다 (.env.example 참고).
# 밖으로 여는 포트는 caddy의 80 · 443뿐이다. DB와 API는 내부 네트워크에서만 보인다.
#
# 이미지는 두 가지 방법으로 준비한다.
# - 내 PC: docker compose up -d --build  (여기서 직접 빌드)
# - 서버:  docker compose --profile https pull && docker compose --profile https up -d --no-build
#          (깃허브 Actions가 빌드해 둔 이미지를 내려받기만 한다. 서버 메모리가 1GB라 빌드를 못 한다)

x-database-url: &database-url postgresql://geogi:${POSTGRES_PASSWORD}@db:5432/geogi

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # 메모리 1GB 서버에 맞춘 작은 설정. 접속하는 프로그램이 api와 worker뿐이라 충분하다.
    command: postgres -c shared_buffers=64MB -c max_connections=20
    environment:
      POSTGRES_DB: geogi
      POSTGRES_USER: geogi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣어 주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geogi -d geogi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/give-it-a-shottt/geogi-boombyeo-backend:latest
    build: ./backend
    restart: unless-stopped
    # 테이블을 최신으로 맞추고 121곳 시드를 넣은 뒤 서버를 띄운다.
    # 마이그레이션은 여기 한 곳에서만 돌린다.
    # --no-access-log: 접속 로그에는 요청 주소가 통째로 남는다. "지금 있는 곳" 요청에는
    # 위도·경도가 들어 있어서, 위치를 저장하지 않는다는 약속을 지키려고 끈다.
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-1} --no-access-log"
    # 조회 API는 서울시 인증키가 필요 없다. 키는 worker에만 준다.
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/give-it-a-shottt/geogi-boombyeo-backend:latest
    build: ./backend
    restart: unless-stopped
    # 수집은 웹 서버와 따로, 반드시 한 개만 띄운다(여러 개면 같은 값을 중복 수집한다).
    command: python -m app.worker
    environment:
      DATABASE_URL: *database-url
      SEOUL_API_KEY: ${SEOUL_API_KEY:?SEOUL_API_KEY를 .env에 넣어 주세요}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/give-it-a-shottt/geogi-boombyeo-web:latest
    build:
      context: ./frontend
      # sitemap · robots · 공유 주소는 빌드할 때 만들어진다. 그래서 사이트 주소는
      # 실행할 때가 아니라 빌드할 때 넣어야 한다.
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    # 이 컴퓨터 안에서만 열린다(127.0.0.1). 인터넷에서 오는 요청은 아래 caddy가 받아 넘긴다.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # HTTPS 문지기. 실제 서버에서만 켠다: docker compose --profile https up -d --build
  # 도메인의 인증서를 무료(Let's Encrypt)로 받아 오고 알아서 갱신한다.
  # 브라우저의 위치 기능은 https 주소에서만 동작하므로 배포할 때 꼭 필요하다.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 받아 온 인증서를 보관한다. 지우면 다시 받아야 하고, 너무 자주 받으면 발급이 막힌다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  db-data:
  caddy-data:
  caddy-config:
